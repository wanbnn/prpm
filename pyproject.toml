[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prpm"
version = "0.4.0"
description = "Package and project manager for the PyReact ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "wanbnn", email = "gcncomercial@gmail.com" },
]
keywords = ["pyreact", "package-manager", "python", "dependencies", "lockfile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "build>=1.2.2",
    "cryptography>=42.0",
    "keyring>=25.0",
    "packaging>=23.2",
    "tomlkit>=0.12.3",
    "twine>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/wanbnn/prpm"
Documentation = "https://prpm.readthedocs.io"
Repository = "https://github.com/wanbnn/prpm"
Issues = "https://github.com/wanbnn/prpm/issues"
PyReact = "https://github.com/wanbnn/pyreact"

[project.scripts]
prpm = "prpm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prpm = ["templates/pyreact_app/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["prpm"]
branch = true
